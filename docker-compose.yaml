version: "3.8"

services:
  postgresql:
      image: postgres:16.1-alpine3.18
      container_name: desc_postgresql
      hostname: desc_postgresql
      command:
        - "postgres"
        - "-c"
        - "config_file=/etc/postgresql.conf"
      environment:
        POSTGRES_DB: "postgresUser"
        POSTGRES_USER: "postgresUser"
        POSTGRES_PASSWORD: "postgresPassword"
        PGDATA: "/var/lib/postgresql/data/pgdata"
      volumes:
        - ./postgresql/Init_Database:/docker-entrypoint-initdb.d
        - ./postgresql/postgresql-data:/var/lib/postgresql/data
        - ./postgresql/postgresql.conf:/etc/postgresql.conf:ro
      ports:
        - "5432:5432"
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgresUser -d postgresUser" ]
        interval: 30s
        timeout: 5s
        retries: 5
        start_period: 10s
      restart: unless-stopped
      networks:
        - my-net

  fastapi:
    container_name: fastapi
    build: ./fastapi
    ports:
      - "8000:8000"
    networks:
      - my-net
    depends_on:
      - postgresql

  app:
    container_name: app
    build: ./app
    networks:
      - my-net
    depends_on:
      - fastapi

networks:
  my-net:
